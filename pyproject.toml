[project]
name = "cnab-toolkit"
version = "0.1.0"
description = "Spec-driven generator, parser and validator for Brazilian CNAB fixed-width banking files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Renato Araujo" }]
dependencies = ["pyyaml>=6.0", "faker>=30.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "hypothesis>=6.100"]

[project.scripts]
cnab = "cnab_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnab_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
